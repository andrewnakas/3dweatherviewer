name: Build weather data and deploy site

on:
  schedule:
    # HRRR runs hourly and dynamical.org ingests it within the hour, so
    # rebuild every hour: the page should open on weather that matches the
    # sky right now, not on a cycle up to six hours old.
    - cron: '35 * * * *'
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      leads:
        description: 'Lead hours subset for a quick test build, e.g. "0 3 6". Empty = all 0-18.'
        default: ''
        required: false
      workers:
        description: 'Parallel lead-hour workers. Drop to 3 if the runner runs out of memory.'
        default: '4'
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build weather frames
        run: |
          # Every deploy builds the FULL forecast. A push used to ship a
          # 3-lead subset for speed, but GitHub throttles scheduled runs
          # (hourly cron fired twice one day, not 24 times), so whenever a
          # push was the last successful deploy the site sat on three
          # forecast hours until a schedule happened to land. Correctness of
          # the deployed artifact beats a faster inner loop.
          LEADS='${{ github.event.inputs.leads }}'
          WORKERS='${{ github.event.inputs.workers }}'
          PYTHONPATH=pipeline python pipeline/build_frames.py \
            --out site/data --workers "${WORKERS:-4}" ${LEADS:+--leads "$LEADS"}

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
